version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: portfolio_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - portfolio_network

  backend:
    build: ./backend
    container_name: portfolio_backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/portfolio
      - PORT=5000
      - JWT_SECRET=mysecretkey
    depends_on:
      - mongodb
    networks:
      - portfolio_network

  frontend:
    build: ./frontend
    container_name: portfolio_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - portfolio_network

volumes:
  mongodb_data:

networks:
  portfolio_network:
    driver: bridge
